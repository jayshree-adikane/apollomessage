<!-- Sales Intelligence Top Navigation -->
<header class="si-topbar">
    <div class="si-topbar-left">
        <button type="button" class="si-mobile-menu" id="mobileMenuToggle"
                aria-label="Open navigation" aria-expanded="false" title="Open navigation">
            <i class="bi bi-list"></i>
        </button>

        <div>
            <div class="si-page-kicker">Sales Intelligence</div>
            <h1 class="si-page-title">Prospect Workspace</h1>
        </div>
    </div>

    <div class="si-topbar-actions">
        <span class="badge rounded-pill workspace-chip px-3 py-2">
            <i class="bi bi-shield-check me-1"></i> Secure Session
        </span>

        <button type="button" class="theme-toggle" id="themeToggle"
                aria-label="Toggle dark and light mode" title="Toggle dark and light mode">
            <i class="bi bi-moon-stars-fill"></i>
            <i class="bi bi-sun-fill"></i>
        </button>

        <div class="si-top-user">
            <div class="si-top-avatar" id="siTopAvatar">U</div>
            <div class="si-top-user-copy">
                <strong id="siTopUserName">{{ user_name|default('Logged-in User', true) }}</strong>
                <span>Active session</span>
            </div>
        </div>
    </div>
</header>
